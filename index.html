<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Tower of Code</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }

      :root {
        --scr-x: 0px; --scr-y: 0px; --scr-w: 480px; --scr-h: 320px;
        --frame-pad: 18px; --frame-plate: 30px; --area-h: 100dvh;
        --night: #03052e;
        --edge: linear-gradient(135deg, #9095ff, #f942ff 50%, #00deff);
        --key: #2b2860;
        --key-low: #1d1a45;
        --key-line: rgba(144, 149, 255, 0.45);
        --key-shadow: #0b0920;
      }

      html, body {
        background: radial-gradient(ellipse at 50% 38%, #1c1846 0%, #0b0b33 48%, var(--night) 100%) fixed;
        background-color: var(--night);
        height: 100vh;
        height: 100dvh;
        overflow: hidden;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }

      /* Phaser's parent: the whole window, so the battle overlay can cover it.
         Clicks go through to the touch controls except on the screen and overlays. */
      #app {
        position: fixed;
        inset: 0;
        z-index: 1;
        pointer-events: none;
      }
      #app > * { pointer-events: auto; }
      #app canvas {
        display: block;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        /* The screen's dark rim inside the frame */
        box-shadow: 0 0 0 3px var(--night), 0 0 0 4px rgba(144, 149, 255, 0.35);
      }

      /* ── The frame around the screen: indigo, a purple → pink → cyan edge, the name plate ── */
      #frame {
        position: fixed;
        z-index: 0;
        left: calc(var(--scr-x) - var(--frame-pad));
        top: calc(var(--scr-y) - var(--frame-pad));
        width: calc(var(--scr-w) + 2 * var(--frame-pad));
        height: calc(var(--scr-h) + 2 * var(--frame-pad) + var(--frame-plate));
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        align-items: center;
        border: 2px solid transparent;
        border-radius: 18px;
        background: linear-gradient(180deg, #1c1846, #0e0b26) padding-box, var(--edge) border-box;
        box-shadow: 0 18px 60px rgba(0, 0, 0, 0.55), 0 0 48px rgba(144, 149, 255, 0.16);
      }
      .frame-plate {
        height: var(--frame-plate);
        overflow: hidden;
        display: flex;
        align-items: center;
        gap: 10px;
        font: 800 13px/1 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        letter-spacing: 0.24em;
        white-space: nowrap;
      }
      .frame-plate b {
        background: var(--edge);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .frame-plate i {
        padding: 3px 8px;
        font-style: normal;
        font-size: 10px;
        letter-spacing: 0.14em;
        color: #1c1846;
        background: linear-gradient(180deg, #ffd36e, #f59e0b);
        border-radius: 999px;
      }
      html.touch #frame { border-radius: 12px; }

      /* ── Touch controls: only on touch screens ── */
      .touch-controls { display: none; }
      html.touch .touch-controls {
        display: block;
        position: fixed;
        z-index: 0;
        inset: 0;
        pointer-events: none;
      }
      .touch-controls > * { pointer-events: auto; position: absolute; touch-action: none; }

      .dpad {
        width: 132px; height: 132px;
      }
      .dpad::before, .dpad::after {
        content: '';
        position: absolute;
        background: linear-gradient(180deg, var(--key), var(--key-low));
        border: 1px solid var(--key-line);
        border-radius: 10px;
        box-shadow: 0 4px 0 var(--key-shadow);
      }
      .dpad::before { left: 44px; top: 0; width: 44px; height: 132px; }
      .dpad::after { left: 0; top: 44px; width: 132px; height: 44px; }
      .dpad[data-dir='up']::before { box-shadow: 0 4px 0 var(--key-shadow), inset 0 18px 0 -6px #4a4496; }
      .dpad[data-dir='down']::before { box-shadow: 0 4px 0 var(--key-shadow), inset 0 -18px 0 -6px #4a4496; }
      .dpad[data-dir='left']::after { box-shadow: 0 4px 0 var(--key-shadow), inset 18px 0 0 -6px #4a4496; }
      .dpad[data-dir='right']::after { box-shadow: 0 4px 0 var(--key-shadow), inset -18px 0 0 -6px #4a4496; }

      .ab { width: 150px; height: 120px; }
      .ab button {
        position: absolute;
        width: 62px; height: 62px;
        border-radius: 50%;
        border: 1px solid var(--key-line);
        background: linear-gradient(180deg, var(--key), var(--key-low));
        color: #c3c6ff;
        font: 800 20px/1 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        box-shadow: 0 5px 0 var(--key-shadow);
        touch-action: none;
      }
      .ab .btn-a {
        right: 0; top: 0;
        color: #fff;
        background: linear-gradient(160deg, #f942ff, #9095ff);
        border-color: rgba(255, 255, 255, 0.35);
      }
      .ab .btn-b { left: 0; bottom: 0; }
      .ab button:active, .ab button.down { transform: translateY(3px); box-shadow: 0 2px 0 var(--key-shadow); }

      .btn-start {
        width: 76px; height: 24px;
        border: 1px solid var(--key-line);
        border-radius: 12px;
        background: linear-gradient(180deg, var(--key), var(--key-low));
        color: #c3c6ff;
        font: 800 10px/22px system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        letter-spacing: 0.14em;
        box-shadow: 0 3px 0 var(--key-shadow);
      }
      .btn-start:active, .btn-start.down { transform: translateY(2px); box-shadow: 0 1px 0 var(--key-shadow); }

      /* Portrait: controls under the screen */
      html.touch.portrait .dpad { left: 6vw; top: calc(var(--area-h) + (100dvh - var(--area-h) - 132px) * 0.42); }
      html.touch.portrait .ab { right: 5vw; top: calc(var(--area-h) + (100dvh - var(--area-h) - 120px) * 0.38); }
      html.touch.portrait .btn-start { left: calc(50% - 38px); bottom: max(18px, env(safe-area-inset-bottom)); }

      /* Landscape: D-pad on the left, A/B on the right */
      html.touch.landscape .dpad { left: max(14px, env(safe-area-inset-left)); top: calc(50% - 66px); }
      html.touch.landscape .ab { right: max(10px, env(safe-area-inset-right)); top: calc(50% - 80px); }
      html.touch.landscape .btn-start { right: max(46px, env(safe-area-inset-right)); bottom: 14px; }
    </style>
  </head>
  <body>
    <div id="frame"><span class="frame-plate"><b>TOWER OF CODE</b><i>PYTHON</i></span></div>
    <div id="app"></div>

    <div class="touch-controls" aria-hidden="true">
      <div class="dpad" id="dpad"></div>
      <div class="ab">
        <button class="btn-b" data-code="Escape">B</button>
        <button class="btn-a" data-code="Space">A</button>
      </div>
      <button class="btn-start" data-code="Enter">START</button>
    </div>

    <script type="module" src="/src/main.ts"></script>

    <!-- Touch buttons → the same keyboard events as a real keyboard (the game reads KeyboardEvent.code) -->
    <script>
      (function () {
        var KEYS = {
          ArrowUp: ['ArrowUp', 38], ArrowDown: ['ArrowDown', 40], ArrowLeft: ['ArrowLeft', 37], ArrowRight: ['ArrowRight', 39],
          Space: [' ', 32], Escape: ['Escape', 27], Enter: ['Enter', 13],
        };
        function fire(type, code) {
          var k = KEYS[code];
          window.dispatchEvent(new KeyboardEvent(type, { key: k[0], code: code, keyCode: k[1], which: k[1], bubbles: true, cancelable: true }));
        }

        // Buttons: press on touch, release when the finger lifts or slides off
        document.querySelectorAll('.touch-controls button').forEach(function (btn) {
          var code = btn.getAttribute('data-code');
          var down = false;
          function release() { if (down) { down = false; btn.classList.remove('down'); fire('keyup', code); } }
          btn.addEventListener('pointerdown', function (e) {
            e.preventDefault();
            btn.setPointerCapture && btn.setPointerCapture(e.pointerId);
            if (!down) { down = true; btn.classList.add('down'); fire('keydown', code); }
          });
          btn.addEventListener('pointerup', release);
          btn.addEventListener('pointercancel', release);
          btn.addEventListener('lostpointercapture', release);
          btn.addEventListener('contextmenu', function (e) { e.preventDefault(); });
        });

        // D-pad: one pad, the thumb can roll from one direction to another
        var pad = document.getElementById('dpad');
        var current = null;
        var CODE = { up: 'ArrowUp', down: 'ArrowDown', left: 'ArrowLeft', right: 'ArrowRight' };
        function setDir(dir) {
          if (dir === current) return;
          if (current) fire('keyup', CODE[current]);
          current = dir;
          pad.setAttribute('data-dir', dir || '');
          if (dir) fire('keydown', CODE[dir]);
        }
        function track(e) {
          var r = pad.getBoundingClientRect();
          var dx = e.clientX - (r.left + r.width / 2);
          var dy = e.clientY - (r.top + r.height / 2);
          if (Math.abs(dx) < 10 && Math.abs(dy) < 10) return setDir(null);
          setDir(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
        }
        pad.addEventListener('pointerdown', function (e) { e.preventDefault(); pad.setPointerCapture(e.pointerId); track(e); });
        pad.addEventListener('pointermove', function (e) { if (pad.hasPointerCapture(e.pointerId)) track(e); });
        ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(function (t) {
          pad.addEventListener(t, function () { setDir(null); });
        });
      })();
    </script>
  </body>
</html>
